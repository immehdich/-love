<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love Heart</title>
<style>
html,body{height:100%;margin:0;background:#050005;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const P=["I love you", "Je t'aime", "Te amo", "Ti amo", "Ich liebe dich", "Eu te amo", "Seni seviyorum", "愛してる", "사랑해", "我爱你", "我愛你", "Я тебя люблю", "Я тебе кохаю", "मैं तुमसे प्यार करता हूँ", "Ik hou van jou", "Jag älskar dig", "Kocham cię", "Σ' αγαπώ", "Anh yêu em", "Aku cinta kamu", "ฉันรักเธอ", "أحبك", "كنبغيك", "אני אוהב אותך", "دوستت دارم", "مجھے تم سے محبت ہے", "আমি তোমাকে ভালোবাসি", "நான் உன்னை காதலிக்கிறேன்", "నేను నిన్ను ప్రేమిస్తున్నాను", "मी तुझ्यावर प्रेम करतो", "હું તને પ્રેમ કરું છું", "ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ", "ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു", "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ", "म तिमीलाई माया गर्छु", "මම ඔබට ආදරෙයි", "ខ្ញុំស្រលាញ់អ្នក", "ຂ້ອຍຮັກເຈົ້າ", "Saya cinta padamu", "Mahal kita", "Gihigugma tika", "Aku tresna marang kowe", "Abdi bogoh ka anjeun", "Kuv hlub koj", "Nakupenda", "Ngiyakuthanda", "Ndiyakuthanda", "Ek is lief vir jou", "እወድሻለሁ", "Ina son ki", "Mo nifẹ rẹ", "Ahụrụ m gị n'anya", "Waan ku jeclahay", "Minä rakastan sinua", "Jeg elsker dig", "Jeg elsker deg", "Ég elska þig", "Miluji tě", "Ľúbim ťa", "Szeretlek", "Te iubesc", "Обичам те", "Волим те", "Volim te", "Ljubim te", "Të dua", "Те сакам", "Aš tave myliu", "Es tevi mīlu", "Ma armastan sind", "Tá grá agam duit", "Rwy'n dy garu di", "Tha gaol agam ort", "Da garout a ran", "Maite zaitut", "T'estimo", "Quérote", "Inħobbok", "Ech hunn dech gär", "მიყვარხარ", "Ես քեզ սիրում եմ", "Səni sevirəm", "Мен сені жақсы көремін", "Men seni sevaman", "Би чамд хайртай", "Ez ji te hez dikim", "Aloha au iā ʻoe", "Aroha ahau ki a koe", "Ou te alofa ia te oe", "Mi amas vin", "Amo te", "איך האב דיך ליב", "Mwen renmen w", "Munakuyki", "Rohayhu"];
let bag=[];const nextI=()=>{if(!bag.length)bag=P.map((_,i)=>i).sort(()=>Math.random()-.5);return bag.pop()};
const FONT=f=>`bold ${f}px Arial,"Segoe UI","Noto Sans",sans-serif`;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let items=[],start=0,shim=[],doneAt=0;
function build(){
  const d=devicePixelRatio||1,w=innerWidth,h=innerHeight;
  cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);
  const small=w<600,size=Math.min(w*(small?0.94:0.82),h*0.88),sx=size/32;
  const sy=sx*0.9*Math.min(small?1.5:1,(h*0.82)/(26.1*sx)),cx=w/2,cy=h*0.55;
  const poly=[];
  for(let i=0;i<500;i++){const t=i/500*Math.PI*2;
    poly.push([cx+16*Math.pow(Math.sin(t),3)*sx,
      cy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)+2.5)*sy]);}
  const inside=(x,y)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const [xi,yi]=poly[i],[xj,yj]=poly[j];
    if((yi>y)!=(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;}return c;};
  const k=small?1.3:1,rowH=size*0.037*k,base=size*0.021*k;
  const top=Math.min(...poly.map(p=>p[1])),bot=Math.max(...poly.map(p=>p[1]));
  items=[];bag=[];let last=-1,row=0;
  for(let y=top+rowH*0.7;y<bot-rowH*0.35;y+=rowH,row++){
    const segs=[];let a=null;
    for(let x=0;x<=w;x+=2){
      const ok=inside(x,y-rowH*0.3)&&inside(x,y+rowH*0.3);
      if(ok&&a===null)a=x;
      if(!ok&&a!==null){segs.push([a+3,x-3]);a=null;}
    }
    for(const [L,R] of segs){
      const W=R-L;if(W<base*4)continue;
      const picks=[];let sum=0;
      for(let g=0;g<60;g++){
        const i=nextI();
        const fs=base*(0.58+Math.random()*0.45);ctx.font=FONT(fs);
        const wd=ctx.measureText(P[i]).width;
        if(sum+wd+base*0.8*picks.length>W)break;
        picks.push({t:P[i],fs,wd});sum+=wd;last=i;
      }
      if(!picks.length)continue;
      const n=picks.length,free=W-sum;
      let gaps=[];
      if(n>1){gaps=Array.from({length:n-1},()=>0.6+Math.random()*0.8);
        const tot=gaps.reduce((p,c)=>p+c,0);gaps=gaps.map(g=>g/tot*free);}
      let x=n>1?L:L+free/2;
      picks.forEach((p,i)=>{
        const xc=x+p.wd/2,e=1-Math.min(1,Math.min(xc-L,R-xc)/(size*0.12));
        items.push({...p,x,y,e,delay:row*55+Math.random()*350});
        x+=p.wd+(gaps[i]||0);
      });
    }
  }
  start=performance.now();shim=[];
  doneAt=Math.max(...items.map(i=>i.delay))+1000;
}
function frame(now){
  const T=now-start,w=innerWidth,h=innerHeight;
  ctx.clearRect(0,0,w,h);ctx.textBaseline='middle';
  if(T>doneAt&&Math.random()<0.08&&shim.length<7)shim.push({i:items[Math.random()*items.length|0],t0:T});
  shim=shim.filter(s=>T-s.t0<1000);
  for(const it of items){
    const p=Math.max(0,Math.min(1,(T-it.delay)/900));if(p<=0)continue;
    const q=1-Math.pow(1-p,3),sh=shim.find(s=>s.i===it);
    const g=sh?Math.sin((T-sh.t0)/1000*Math.PI):0;
    ctx.globalAlpha=q;
    ctx.font=FONT(it.fs);
    ctx.shadowColor=g>0.05?`rgba(255,150,170,${0.4+g*0.5})`:'rgba(120,0,16,.9)';
    ctx.shadowBlur=g>0.05?4+g*14:3;
    ctx.shadowOffsetX=g>0.05?0:1.5;ctx.shadowOffsetY=g>0.05?0:1.5;
    ctx.fillStyle=`hsl(${352+g*4},${92-g*45}%,${46+it.e*8+g*42}%)`;
    ctx.fillText(it.t,it.x,it.y+(1-q)*55);
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.shadowOffsetX=ctx.shadowOffsetY=0;
  requestAnimationFrame(frame);
}
addEventListener('resize',build);addEventListener('click',build);
build();requestAnimationFrame(frame);
</script>
</body>
</html>
