<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05010a">
<title>♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#05010a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.sc{font-family:'Cormorant Garamond','Palatino Linotype',Georgia,serif;font-style:italic;font-weight:500}
#lab{position:fixed;left:0;right:0;top:calc(9vh + env(safe-area-inset-top,0px));text-align:center;padding:0 8%;pointer-events:none;color:#fff1e2;
 opacity:0;filter:blur(8px);transition:opacity 1.2s,filter 1.2s;text-shadow:0 0 14px rgba(255,150,90,.8),0 0 40px rgba(180,30,60,.8)}
#lab.on{opacity:1;filter:blur(0)}
#lab .k{font:300 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,215,170,.85);margin-bottom:12px}
#lab .t{font-size:clamp(32px,9vw,52px);line-height:1.1;font-weight:600}
#lab .x{font-size:clamp(21px,5vw,28px);line-height:1.4;margin-top:10px;opacity:.95;max-width:640px;margin-left:auto;margin-right:auto}
#hint{position:fixed;left:0;right:0;bottom:calc(8vh + env(safe-area-inset-bottom,0px));text-align:center;padding:0 8%;
 font:300 13px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,215,170,.85);
 pointer-events:none;transition:opacity 1s;animation:pulse 2.8s ease-in-out infinite}
#hint.off{opacity:0;animation:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#dots{position:fixed;left:0;right:0;bottom:calc(3.5vh + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:9px;pointer-events:none;transition:opacity 1s}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,220,180,.2);transition:background .8s,box-shadow .8s}
#dots i.v{background:#ffd48a;box-shadow:0 0 8px #ffb55a}
#again{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4vh + env(safe-area-inset-bottom,0px));display:none;background:rgba(20,4,10,.55);
 border:1px solid rgba(255,200,170,.4);color:#ffd9bd;border-radius:999px;padding:10px 24px;font:300 13px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.3em;text-transform:uppercase;cursor:pointer}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,1,3,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
 opacity:0;pointer-events:none;transition:opacity .8s;touch-action:pan-y}
#ov.on{opacity:1;pointer-events:auto}
#card{width:min(90vw,580px);max-height:84vh;overflow-y:auto;padding:30px 26px 24px;border-radius:20px;background:linear-gradient(160deg,rgba(62,10,26,.93),rgba(20,4,10,.95));
 border:1px solid rgba(255,190,150,.25);box-shadow:0 20px 80px rgba(0,0,0,.7);transform:scale(.92) translateY(14px);transition:transform .8s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
#card::-webkit-scrollbar{display:none}
#ov.on #card{transform:none}
#card .k{font:600 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.3em;text-transform:uppercase;margin-bottom:18px;text-align:center;color:#ffe9b0}
#body{font-size:clamp(22px,5.4vw,30px);line-height:1.55;text-align:left;color:#fff0e0}
.w{opacity:0;filter:blur(5px);transition:opacity .9s,filter .9s}.w.on{opacity:1;filter:blur(0)}
#close{display:none;margin:22px auto 0;background:none;border:1px solid rgba(255,200,170,.4);color:#ffd9bd;border-radius:999px;padding:10px 26px;
 font:300 13px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.3em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lab" class="sc"><div class="k"></div><div class="t"></div><div class="x"></div></div>
<div id="hint">Move your finger through the dark ♡</div>
<div id="dots"></div>
<button id="again">♡</button>
<div id="ov"><div id="card"><div class="k">A letter, just for you</div><div id="body" class="sc"></div><button id="close">♡</button></div></div>
<script>
const LETTER="I'll always choose you, love you, and find a thousand little ways to make you smile. I'll spoil you, adore you, hold you close when the world gets heavy, and remind you every day how precious you are to me. I want to be beside you through all the beautiful moments and the difficult ones too.\n\nOut of every universe that could've existed, somehow I got you. And pretty girl, I'll spend my days making sure you know just how much that means to me.";
const KIND="Something I love about you";
const FL=[
 {title:"Your Laugh",text:"Your little laugh is my weakness, princess. One tiny giggle from you and my heart forgets how to behave.",u:.2,v:.78,h:.27,R:1,pal:['#c8284c','#7d0c26','#3f0210'],Np:62,wr:.58,len:1,glow:'210,36,76'},
 {title:"Your Eyes",text:"Your eyes hold a universe of their own, and every time I look into them I forget there's a whole world outside.",u:.8,v:.76,h:.28,R:1,pal:['#b01e42','#6a0a20','#2e0109'],Np:66,wr:.58,len:1,glow:'190,28,66'},
 {title:"Your Beauty",text:"You're the kind of beauty words can't explain. A pretty face that stays inside my brain, so gorgeous it feels almost unfair, like the stars got jealous when you appeared.",u:.37,v:.91,h:.22,R:1,pal:['#d03a5a','#8a1230','#47040f'],Np:60,wr:.6,len:1,glow:'220,50,88'},
 {title:"The Feeling of Being With You",text:"Being with you feels like a dream I never want to wake from. Like somehow, in this endless universe, my heart found its home in you.",u:.67,v:.93,h:.22,R:1,pal:['#9a1836','#5e0818','#280108'],Np:68,wr:.58,len:1,glow:'170,24,58'},
 {title:"And one last flower…",text:"",u:.5,v:.84,h:.4,R:2,pal:['#d83c5e','#8f1234','#400310'],Np:96,wr:.6,len:1,glow:'230,60,96',last:true}
];
const WAVE_PAL=[['#c8284c','#7d0c26','#3f0210'],['#a81a3e','#6a0a20','#2e0109'],['#d03a5a','#8a1230','#47040f'],['#8f1633','#560818','#240108']];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dk=document.createElement('canvas'),dx=dk.getContext('2d');
const lab=document.getElementById('lab'),hint=document.getElementById('hint'),dotsEl=document.getElementById('dots'),again=document.getElementById('again');
const ov=document.getElementById('ov'),bodyEl=document.getElementById('body'),closeBtn=document.getElementById('close');
for(let i=0;i<FL.length;i++)dotsEl.appendChild(document.createElement('i'));
const dots=[...dotsEl.children];
let W,H,D,gy,bgc,grass=[],stars=[],pollen=[],wave=[],rain=[],found=0,finalStart=0,letterOpened=false,ptr={x:0,y:0,on:false,moved:false},lx=0,ly=0,labT=null,tmr=[],revealed=false,lastNow=0;
const GA=2.39996,cl=x=>Math.max(0,Math.min(1,x)),ease=x=>.5-.5*Math.cos(Math.PI*x),eo=x=>1-Math.pow(1-x,3);
function spr(rgb){const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,`rgba(${rgb},.9)`);r.addColorStop(.35,`rgba(${rgb},.35)`);r.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=r;g.fillRect(0,0,64,64);return s;}
const GL=FL.map(f=>spr(f.glow)),GOLD=spr('255,215,130'),WG=spr('200,36,76');
function build(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);dk.width=W;dk.height=H;
  gy=H*.7;
  bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;const c=bgc.getContext('2d');
  const sk=c.createLinearGradient(0,0,0,gy);sk.addColorStop(0,'#05010a');sk.addColorStop(1,'#240814');c.fillStyle=sk;c.fillRect(0,0,W,H);
  c.fillStyle='#10040c';c.beginPath();c.moveTo(0,gy);for(let x=0;x<=W;x+=8)c.lineTo(x,gy-H*.05-Math.sin(x/W*5)*H*.025-Math.sin(x/W*13)*H*.01);c.lineTo(W,gy);c.fill();
  c.fillStyle='#0a0308';c.beginPath();c.moveTo(0,gy);for(let x=0;x<=W;x+=8)c.lineTo(x,gy-H*.02-Math.sin(x/W*7+1)*H*.018);c.lineTo(W,gy);c.fill();
  const gd=c.createLinearGradient(0,gy,0,H);gd.addColorStop(0,'#0b0a09');gd.addColorStop(1,'#050204');c.fillStyle=gd;c.fillRect(0,gy-1,W,H-gy+1);
  stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*gy*.8,r:Math.random()*1.1+.2,ph:Math.random()*6});
  grass=[];for(let i=0;i<Math.round(W/3.2);i++)grass.push({x:Math.random()*W,y:gy+Math.random()*(H-gy),h:H*(.025+Math.random()*.05),th:Math.random(),ph:Math.random()*6,hu:140+Math.random()*30});
  grass.sort((a,b)=>a.y-b.y);
  if(!pollen.length)for(let i=0;i<90;i++)pollen.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,ph:Math.random()*6,s:1.8+Math.random()*2.6});
  FL.forEach(f=>{f.x=f.u*W;f.y=f.v*H;f.hh=f.h*H;f.rr=Math.min(W,H)*.075*f.R;});
}
function petal(c,L,w){c.beginPath();c.moveTo(0,0);c.bezierCurveTo(L*.22,-w,L*.92,-w*.95,L,0);c.bezierCurveTo(L*.92,w*.95,L*.22,w,0,0);c.closePath();}
function head(c,x,y,R,pal,Np,wr,len,open,t){
  for(let j=Np-1;j>=0;j--){
    const f=j/Np;let e=eo(cl((open*1.3-f*.8)/.35));if(j<6)e=Math.max(e,.4*open);if(e<=0)continue;
    const a=j*GA+t*.02,d=R*.55*Math.sqrt(f)*(.55+.45*e),L=R*(.2+.45*Math.pow(f,.6))*len*(.4+.6*e),w=L*wr;
    c.save();c.translate(x+Math.cos(a)*d,y+Math.sin(a)*d*.85);c.rotate(a);
    const g=c.createLinearGradient(0,0,L,0);g.addColorStop(0,pal[2]);g.addColorStop(.55,pal[1]);g.addColorStop(1,pal[0]);
    petal(c,L,w);c.fillStyle=g;c.fill();c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=1;c.stroke();c.restore();
  }
}
function stemPt(bx,by,hx,hy,bend,k){const p1x=bx-bend*.6,p1y=by-(by-hy)*.55,u=1-k;return [u*u*bx+2*u*k*p1x+k*k*hx,u*u*by+2*u*k*p1y+k*k*hy];}
function drawPlant(c,bx,by,hh,bend,k,openT,pal,Np,wr,len,R,t,hue){
  const hx=bx+bend,hy=by-hh;
  c.strokeStyle=`hsl(${hue||150},38%,22%)`;c.lineWidth=Math.max(2,R*.07);c.lineCap='round';c.beginPath();
  for(let i=0;i<=24;i++){const [x,y]=stemPt(bx,by,hx,hy,bend,k*i/24);i?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();
  for(const [tt,sd] of [[.38,-1],[.58,1]]){if(k<tt+.1)continue;const g=cl((k-tt-.1)/.3),[x,y]=stemPt(bx,by,hx,hy,bend,tt);
    c.save();c.translate(x,y);c.rotate(-Math.PI/2+sd*.9);petal(c,R*.9*g,R*.3*g);c.fillStyle=`hsl(${hue||150},40%,24%)`;c.fill();c.restore();}
  if(openT>0){const [x,y]=stemPt(bx,by,hx,hy,bend,k);head(c,x,y,R*(.4+.6*openT),pal,Np,wr,len,openT,t);return [x,y];}
  return null;
}
function showLabel(f){
  lab.querySelector('.k').textContent=f.last?'':KIND;lab.querySelector('.t').textContent=f.title;lab.querySelector('.x').textContent=f.text;
  lab.classList.add('on');clearTimeout(labT);labT=setTimeout(()=>lab.classList.remove('on'),f.last?4500:6500);
}
function discover(f,now){
  if(f.found)return;f.found=true;f.t0=now;found++;dots.forEach((d,i)=>d.classList.toggle('v',i<found));hint.classList.add('off');
  setTimeout(()=>showLabel(f),1800);
  if(found===FL.length-1){setTimeout(()=>{hint.textContent='One last light is waiting ♡';hint.classList.remove('off');},3500);}
  if(f.last){finalStart=now;hint.classList.add('off');dotsEl.style.opacity=0;
    for(let i=0;i<30;i++)wave.push({x:Math.random()*W,y:gy+H*.06+Math.random()*(H*.9-gy),hh:H*(.08+Math.random()*.1),bend:(Math.random()-.5)*18,
      d:Math.random()*3.2,pal:WAVE_PAL[i%4],Np:34,R:Math.min(W,H)*(.03+Math.random()*.03),hue:140+Math.random()*30});
    wave.sort((a,b)=>a.y-b.y);
    setTimeout(openLetter,10500);}
}
function frame(now){
  const dt=Math.min(.05,(now-lastNow)/1000||0);lastNow=now;const t=now/1000;
  const g=found/FL.length,fin=finalStart?cl((now-finalStart)/1000/10):0,dawn=finalStart?ease(cl((now-finalStart-3500)/7000)):0;
  /* lantern */
  const tx=ptr.moved?ptr.x:W*.5+Math.sin(t*.6)*W*.22,ty=ptr.moved?ptr.y:H*.72+Math.cos(t*.5)*H*.04;
  lx+=(tx-lx)*.18;ly+=(ty-ly)*.18;const Lr=Math.min(W,H)*(.2+.1*g)+dawn*Math.max(W,H);
  /* background */
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(bgc,0,0,W,H);
  const hg=ctx.createRadialGradient(W/2,gy,0,W/2,gy,Math.max(W,H)*.8);
  hg.addColorStop(0,`rgba(160,28,64,${g*.5+dawn*.2})`);hg.addColorStop(.5,`rgba(100,14,50,${g*.25})`);hg.addColorStop(1,'rgba(100,14,50,0)');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,gy+4);
  if(dawn>0){const dg=ctx.createLinearGradient(0,0,0,gy);dg.addColorStop(0,`rgba(90,20,70,${dawn*.45})`);dg.addColorStop(1,`rgba(255,160,90,${dawn*.45})`);ctx.fillStyle=dg;ctx.fillRect(0,0,W,gy+4);}
  for(const s of stars){ctx.globalAlpha=(1-dawn)*(.2+.5*Math.pow(Math.sin(t*.9+s.ph),2));ctx.fillStyle='#ffe9d0';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  const mx=W*.82,my=H*.13,mr=Math.min(W,H)*.05,ma=.25+.6*g;
  const mg=ctx.createRadialGradient(mx,my,0,mx,my,mr*4);mg.addColorStop(0,`rgba(255,240,210,${ma*.5})`);mg.addColorStop(1,'rgba(255,240,210,0)');
  ctx.fillStyle=mg;ctx.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);ctx.globalAlpha=ma;ctx.fillStyle='#fff3d8';ctx.beginPath();ctx.arc(mx,my,mr,0,6.283);ctx.fill();ctx.globalAlpha=1;
  /* grass */
  ctx.lineCap='round';
  for(const b of grass){const gr=ease(cl(g*1.8+dawn-b.th*.9+.1));if(gr<=0)continue;const h=b.h*gr,sw=Math.sin(t*1.3+b.ph)*h*.25;
    ctx.strokeStyle=`hsl(${b.hu},${22+dawn*8}%,${14+g*10+dawn*8}%)`;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.quadraticCurveTo(b.x+sw*.4,b.y-h*.5,b.x+sw,b.y-h);ctx.stroke();}
  /* plants */
  const items=[];
  for(const f of FL)if(f.found)items.push({y:f.y,f});
  for(const w of wave)items.push({y:w.y,w});
  items.sort((a,b)=>a.y-b.y);
  const glows=[];
  for(const it of items){
    if(it.f){const f=it.f,k=ease(cl((now-f.t0)/(f.last?4500:3200))),openT=cl((k-.5)/.5);
      const bend=f.last?0:(f.u<.5?18:-18),pos=drawPlant(ctx,f.x,f.y,f.hh,bend,k,openT,f.pal,f.Np,f.wr,f.len,f.rr,t);
      if(pos){f.hx=pos[0];f.hy=pos[1];f.open=openT;glows.push([pos[0],pos[1],f.rr*4.2*(.8+.2*Math.sin(t*2+f.Np)),FL.indexOf(f),openT]);}}
    else{const w=it.w,k=ease(cl((now-finalStart-4500-w.d*1000)/2600));if(k<=0)continue;const openT=cl((k-.5)/.5);
      const pos=drawPlant(ctx,w.x,w.y,w.hh,w.bend,k,openT,w.pal,w.Np,.58,1,w.R,t,w.hue);
      if(pos)glows.push([pos[0],pos[1],w.R*4,-1,openT]);}
  }
  /* darkness with lantern */
  const A=finalStart?(.9*(1-g)+.08)*(1-dawn)+.0:(.9*(1-g)+.08);
  dx.globalCompositeOperation='source-over';dx.clearRect(0,0,W,H);dx.fillStyle=`rgba(3,0,5,${A})`;dx.fillRect(0,0,W,H);
  dx.globalCompositeOperation='destination-out';
  const lg=dx.createRadialGradient(lx,ly,0,lx,ly,Lr);lg.addColorStop(0,'rgba(0,0,0,1)');lg.addColorStop(.55,'rgba(0,0,0,.75)');lg.addColorStop(1,'rgba(0,0,0,0)');
  dx.fillStyle=lg;dx.fillRect(lx-Lr,ly-Lr,Lr*2,Lr*2);
  for(const q of glows){const hr=q[2]*1.3,hg2=dx.createRadialGradient(q[0],q[1],0,q[0],q[1],hr);hg2.addColorStop(0,`rgba(0,0,0,${.85*q[4]})`);hg2.addColorStop(1,'rgba(0,0,0,0)');dx.fillStyle=hg2;dx.fillRect(q[0]-hr,q[1]-hr,hr*2,hr*2);}
  ctx.drawImage(dk,0,0,W,H);
  /* light layer */
  ctx.globalCompositeOperation='lighter';
  const lh=ctx.createRadialGradient(lx,ly,0,lx,ly,Lr*.5);lh.addColorStop(0,`rgba(255,200,120,${ptr.on||!ptr.moved?.22:.12})`);lh.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=lh;ctx.fillRect(lx-Lr,ly-Lr,Lr*2,Lr*2);
  for(const q of glows){ctx.globalAlpha=.5*q[4]*(1-dawn*.4);const img=q[3]>=0?GL[q[3]]:WG;ctx.drawImage(img,q[0]-q[2],q[1]-q[2],q[2]*2,q[2]*2);}
  /* pollen */
  const np=Math.min(pollen.length,Math.round(8+g*40+dawn*20));
  for(let i=0;i<np;i++){const p=pollen[i];p.vx+=(Math.sin(t*.7+p.ph)*.02-p.vx*.02);p.vy+=(-.012-p.vy*.02);p.x+=p.vx;p.y+=p.vy;
    if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
    const d=Math.hypot(p.x-lx,p.y-ly),near=d<Lr?1-d/Lr:0;ctx.globalAlpha=Math.min(1,(.15+.5*Math.pow(Math.sin(t*1.6+p.ph),2))*(.5+g)+near*.6);
    ctx.drawImage(GOLD,p.x-p.s,p.y-p.s,p.s*2,p.s*2);}
  /* seeds */
  for(const f of FL){if(f.found)continue;
    let vis=1;if(f.last){if(found<FL.length-1)continue;vis=cl((now-(f.vt||(f.vt=now)))/2500);}
    const d=Math.hypot(f.x-lx,f.y-ly),near=cl(1-d/(Lr*1.7)),pulse=.5+.5*Math.sin(t*2.4+f.u*9);
    const s=(f.last?26:15)*(.8+.4*pulse)*(1+near);
    ctx.globalAlpha=vis*Math.min(1,(f.last?.55:.18)+near*.8+pulse*.15);
    ctx.drawImage(GOLD,f.x-s,f.y-s,s*2,s*2);
    if(ptr.on&&d<50){f.dw=(f.dw||0)+dt;if(f.dw>.5)discover(f,now);}else f.dw=Math.max(0,(f.dw||0)-dt*2);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  /* petal rain */
  if(finalStart&&now-finalStart>3500&&rain.length<46&&Math.random()<.15)rain.push({x:Math.random()*W,y:-20,vy:.8+Math.random()*1.2,ph:Math.random()*6,rot:Math.random()*6,rv:(Math.random()-.5)*.04,s:6+Math.random()*7});
  rain=rain.filter(r=>r.y<H+30);
  for(const r of rain){r.y+=r.vy;r.x+=Math.sin(t*1.2+r.ph)*.7;r.rot+=r.rv;ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);
    const pg=ctx.createLinearGradient(0,0,r.s,0);pg.addColorStop(0,'#5a0518');pg.addColorStop(1,'#d03a5c');petal(ctx,r.s,r.s*.58);ctx.fillStyle=pg;ctx.globalAlpha=.9;ctx.fill();ctx.restore();}
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
/* letter */
function clearT(){tmr.forEach(clearTimeout);tmr=[];}
function openLetter(){
  if(ov.classList.contains('on'))return;clearT();bodyEl.innerHTML='';closeBtn.style.display='none';revealed=false;
  const ws=[];LETTER.split('\n\n').forEach((para,pi)=>{if(pi){bodyEl.appendChild(document.createElement('br'));bodyEl.appendChild(document.createElement('br'));}para.split(' ').forEach(w=>{const e=document.createElement('span');e.className='w';e.textContent=w+' ';bodyEl.appendChild(e);ws.push(e);});});
  const done=()=>{revealed=true;closeBtn.style.display='block';};
  let i=0;const step=()=>{if(i>=ws.length){done();return;}ws[i++].classList.add('on');tmr.push(setTimeout(step,/[,.:]$/.test(ws[i-1].textContent.trim())?300:85));};
  bodyEl.onclick=()=>{if(!revealed){clearT();ws.forEach(w=>w.classList.add('on'));done();}};
  ov.classList.add('on');document.getElementById('card').scrollTop=0;tmr.push(setTimeout(step,700));lab.classList.remove('on');
}
function closeLetter(){clearT();ov.classList.remove('on');again.style.display='block';}
closeBtn.onclick=closeLetter;again.onclick=openLetter;
ov.addEventListener('pointerdown',e=>{if(e.target===ov&&revealed)closeLetter();});
/* input */
function pos(e){ptr.x=e.clientX;ptr.y=e.clientY;ptr.moved=true;}
cv.addEventListener('pointerdown',e=>{pos(e);ptr.on=true;const now=performance.now();
  for(const f of FL){if(f.found){if(f.hx!==undefined&&!f.last&&Math.hypot(e.clientX-f.hx,e.clientY-f.hy)<f.rr*1.2)showLabel(f);continue;}
    if(f.last&&found<FL.length-1)continue;if(Math.hypot(e.clientX-f.x,e.clientY-f.y)<58)discover(f,now);}});
cv.addEventListener('pointermove',e=>{pos(e);if(e.pointerType==='mouse')ptr.on=true;});
addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')ptr.on=false;});
addEventListener('pointercancel',()=>{ptr.on=false;});
addEventListener('resize',build);
build();lx=W/2;ly=H*.72;requestAnimationFrame(frame);
</script>
