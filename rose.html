<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amina ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0;background:#0b0206;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fog{transition:opacity 3.4s ease,filter 3.4s ease}
#fog.melt{opacity:0;filter:blur(10px)}
.t{position:fixed;left:0;right:0;text-align:center;pointer-events:none;color:#fff3f5;
 font-family:'Dancing Script','Segoe Script','Brush Script MT',cursive;font-weight:600;line-height:1.1;
 opacity:0;filter:blur(12px);letter-spacing:.25em;
 text-shadow:0 0 10px rgba(200,30,60,.95),0 0 30px rgba(150,10,40,.9),0 0 60px rgba(128,0,32,.8);
 transition:opacity 3s ease,filter 3s ease,letter-spacing 3.4s cubic-bezier(.2,.7,.2,1)}
.t.show{opacity:1;filter:blur(0);letter-spacing:.04em}
#hint{position:fixed;left:0;right:0;bottom:calc(10vh + env(safe-area-inset-bottom,0px));text-align:center;
 font:300 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.4em;text-transform:uppercase;
 color:rgba(90,25,45,.8);pointer-events:none;animation:pulse 2.6s ease-in-out infinite;transition:opacity 1s}
#hint.gone{opacity:0;animation:none}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="name" class="t"></div>
<div id="msg" class="t"></div>
<canvas id="fog"></canvas>
<div id="hint"></div>
<script>
const NAME="Amina",MESSAGE="You're the best thing that ever happened to me. Every day with you is a gift, my princess.",HINT="Wipe ♡";
const sc=document.getElementById('scene'),sx=sc.getContext('2d'),fg=document.getElementById('fog'),fx=fg.getContext('2d');
const nameEl=document.getElementById('name'),msgEl=document.getElementById('msg'),hintEl=document.getElementById('hint');
nameEl.textContent=NAME;hintEl.textContent=HINT;msgEl.textContent=MESSAGE;
let W,H,D,R,cx,cy,fb,bloomOn=false,bloomStart=0,frameN=0,brushR,last=null,wiping=false,fallen=[],lastSpawn=0,melted=false;
const N=72,GA=2.39996;
const brush=document.createElement('canvas');brush.width=brush.height=128;
{const g=brush.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);
 r.addColorStop(0,'rgba(0,0,0,1)');r.addColorStop(.5,'rgba(0,0,0,.95)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);}
const probe=document.createElement('canvas');probe.width=probe.height=30;const px=probe.getContext('2d');
function makeFog(){
  fb=document.createElement('canvas');fb.width=W*D;fb.height=H*D;const c=fb.getContext('2d');c.scale(D,D);
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#d0c4ca');g.addColorStop(1,'#a2949c');c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let i=0;i<W*H/200;i++){c.fillStyle=Math.random()<.5?`rgba(255,255,255,${.03+Math.random()*.08})`:`rgba(70,45,58,${.03+Math.random()*.06})`;
    c.beginPath();c.arc(Math.random()*W,Math.random()*H,1+Math.random()*2.5,0,6.283);c.fill();}
  for(let i=0;i<W*H/8000;i++){const x=Math.random()*W,y=Math.random()*H,r=3+Math.random()*7;
    const rg=c.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);rg.addColorStop(0,'rgba(255,255,255,.6)');rg.addColorStop(.6,'rgba(205,190,200,.15)');rg.addColorStop(1,'rgba(60,40,55,.4)');
    c.fillStyle=rg;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();}
  fx.setTransform(1,0,0,1,0,0);fx.globalCompositeOperation='source-over';fx.clearRect(0,0,fg.width,fg.height);
  fx.globalAlpha=.97;fx.drawImage(fb,0,0);fx.globalAlpha=1;
}
function resize(){
  D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  for(const c of [sc,fg]){c.width=W*D;c.height=H*D;}
  sx.setTransform(D,0,0,D,0,0);
  R=Math.min(W*.26,H*.22);cx=W/2;cy=H*.4;brushR=Math.min(W,H)*.075;
  nameEl.style.fontSize=Math.min(W*.2,H*.11)+'px';nameEl.style.top=(H*.69)+'px';
  msgEl.style.fontSize=Math.min(W*.075,H*.04)+'px';msgEl.style.top=(H*.81)+'px';msgEl.style.padding='0 8%';
  if(!bloomOn)makeFog();
}
const ease=x=>.5-.5*Math.cos(Math.PI*x),eo=x=>1-Math.pow(1-x,3),cl=x=>Math.max(0,Math.min(1,x));
function petal(c,L,w){c.beginPath();c.moveTo(0,0);c.bezierCurveTo(L*.22,-w,L*.92,-w*.95,L,0);c.bezierCurveTo(L*.92,w*.95,L*.22,w,0,0);c.closePath();}
function rose(b,t){
  const rot=t*.04,breathe=1+.012*Math.sin(t*1.2);
  const gl=sx.createRadialGradient(cx,cy,0,cx,cy,R*2.4);gl.addColorStop(0,`rgba(150,10,40,${.2+.35*b})`);gl.addColorStop(1,'rgba(150,10,40,0)');
  sx.fillStyle=gl;sx.fillRect(0,0,W,H);
  for(let j=N-1;j>=0;j--){
    const f=j/N;let e=eo(cl((b*1.3-f*.8)/.35));if(j<10)e=Math.max(e,.45);if(e<=0)continue;
    const a=j*GA+rot,d=R*.62*Math.sqrt(f)*(.55+.45*e)*breathe,L=R*(.22+.4*Math.pow(f,.6))*(.4+.6*e)*breathe,w=L*.58;
    sx.save();sx.translate(cx+Math.cos(a)*d,cy+Math.sin(a)*d);sx.rotate(a);
    const g=sx.createLinearGradient(0,0,L,0);
    g.addColorStop(0,'rgb(45,2,14)');g.addColorStop(.55,`rgb(${110+40*f|0},8,${32+10*f|0})`);g.addColorStop(1,`rgb(${165+40*f|0},${20+14*f|0},${48+14*f|0})`);
    petal(sx,L,w);sx.fillStyle=g;sx.fill();sx.strokeStyle=`rgba(255,110,125,${.12+.2*f})`;sx.lineWidth=1;sx.stroke();
    sx.restore();
  }
}
function drawFalling(t,now){
  if(now-lastSpawn>380&&fallen.length<34){lastSpawn=now;const a=Math.random()*6.283,r=Math.random()*R*.9;
    fallen.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,vy:.5+Math.random()*.8,ph:Math.random()*6.28,rot:Math.random()*6.28,rv:(Math.random()-.5)*.03,s:R*(.1+Math.random()*.1)});}
  fallen=fallen.filter(p=>p.y<H+60);
  for(const p of fallen){p.y+=p.vy;p.x+=Math.sin(t*1.3+p.ph)*.6;p.rot+=p.rv;
    sx.save();sx.translate(p.x,p.y);sx.rotate(p.rot);sx.globalAlpha=.9;
    const g=sx.createLinearGradient(0,0,p.s,0);g.addColorStop(0,'rgb(70,4,20)');g.addColorStop(1,'rgb(175,24,56)');
    petal(sx,p.s,p.s*.58);sx.fillStyle=g;sx.fill();sx.restore();}
  sx.globalAlpha=1;
}
function startBloom(now){bloomOn=true;bloomStart=now;hintEl.classList.add('gone');fg.classList.add('melt');setTimeout(()=>{fg.style.display='none';},3600);}
function frame(now){
  frameN++;const t=now/1000;
  const bg=sx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.8);bg.addColorStop(0,'#2a0610');bg.addColorStop(1,'#0b0206');
  sx.fillStyle=bg;sx.fillRect(0,0,W,H);
  const b=bloomOn?ease(cl((now-bloomStart)/6500)):0;
  rose(b,t);
  if(bloomOn&&b>.9)drawFalling(t,now);
  if(bloomOn&&now-bloomStart>5200){nameEl.classList.add('show');msgEl.classList.add('show');}
  if(!bloomOn){
    if(frameN%4===0){fx.globalCompositeOperation='source-over';fx.globalAlpha=.005;fx.drawImage(fb,0,0);fx.globalAlpha=1;}
    if(frameN%15===0){px.clearRect(0,0,30,30);px.drawImage(fg,0,0,30,30);const d=px.getImageData(0,0,30,30).data;let n=0;
      for(let i=3;i<d.length;i+=4)if(d[i]<90)n++;if(n/900>.22)startBloom(now);}
  }
  requestAnimationFrame(frame);
}
function wipe(x,y){
  if(bloomOn)return;fx.globalCompositeOperation='destination-out';
  if(last){const dx=x-last.x,dy=y-last.y,dist=Math.hypot(dx,dy),st=Math.max(2,brushR*.35),n=Math.ceil(dist/st);
    for(let i=1;i<=n;i++)fx.drawImage(brush,(last.x+dx*i/n-brushR)*D,(last.y+dy*i/n-brushR)*D,brushR*2*D,brushR*2*D);}
  else fx.drawImage(brush,(x-brushR)*D,(y-brushR)*D,brushR*2*D,brushR*2*D);
  fx.globalCompositeOperation='source-over';last={x,y};hintEl.classList.add('gone');
}
addEventListener('pointerdown',e=>{wiping=true;last=null;wipe(e.clientX,e.clientY);});
addEventListener('pointermove',e=>{if(wiping||e.pointerType==='mouse')wipe(e.clientX,e.clientY);});
addEventListener('pointerup',()=>{wiping=false;last=null;});
addEventListener('pointercancel',()=>{wiping=false;last=null;});
addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
</script>
</body>
</html>
